<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conference Manager</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pf-theme:       #3E4C9C; /* overridden per-conference via JS */
    --pf-theme-light: #EEF0FA; /* overridden per-conference via JS */
    --pf-ink:         #1E2233;
    --pf-white:       #FFFFFF;
    --pf-gray:        #F5F6FA;
    --pf-border:      #DADFF0;
    --pf-muted:       #656B85;
    --pf-green:       #1E7A3D;
    --pf-green-light: #E7F5EC;
    --pf-red:         #B3261E;
    --pf-red-light:   #FBECEA;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef0f6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 12px;
    color: var(--pf-ink);
  }

  .shell {
    width: 100%;
    max-width: 480px;
    background: var(--pf-white);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(30,34,51,0.10);
    min-height: 600px;
  }

  /* ── Loading / error states ─────────────────────────────────────── */
  .state-screen {
    padding: 60px 24px;
    text-align: center;
    color: var(--pf-muted);
    font-size: 13.5px;
  }
  .state-screen h2 { color: var(--pf-ink); font-size: 16px; margin-bottom: 8px; }

  /* ── Header ──────────────────────────────────────────────────────── */
  .conf-header {
    background: var(--pf-theme);
    color: #fff;
    padding: 20px;
  }
  .conf-header .eyebrow {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
    opacity: .85; margin-bottom: 6px; display:flex; align-items:center; justify-content:space-between;
  }
  .conf-header h1 { font-size: 19px; margin-bottom: 4px; }
  .conf-header .dates { font-size: 12.5px; opacity: .92; }
  .mode-badge {
    background: rgba(255,255,255,0.2);
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: bold;
  }

  /* ── Login screen ────────────────────────────────────────────────── */
  .login-body { padding: 28px 24px; }
  .login-body .login-label {
    font-size: 11px; font-weight: bold; color: var(--pf-theme);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px;
  }
  .login-body input[type="text"] {
    width: 100%; border: 2px solid var(--pf-border); border-radius: 8px;
    padding: 14px; font-size: 22px; font-weight: bold; text-align: center;
    letter-spacing: .08em; color: var(--pf-ink); font-family: inherit;
  }
  .login-body input[type="text"]:focus { border-color: var(--pf-theme); outline: none; }
  .login-hint { font-size: 11px; color: var(--pf-muted); margin-top: 8px; text-align: center; }
  .login-error { font-size: 12px; color: var(--pf-red); margin-top: 8px; text-align: center; min-height: 16px; }
  .login-btn {
    width: 100%; margin-top: 16px; padding: 15px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: bold; background: var(--pf-theme); color: #fff; cursor: pointer;
  }
  .login-btn:hover { filter: brightness(0.92); }
  .login-divider {
    display: flex; align-items: center; gap: 10px; margin: 20px 0;
    color: var(--pf-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  }
  .login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--pf-border); }
  .pin-btn {
    width: 100%; padding: 12px; border: 2px solid var(--pf-border); border-radius: 10px;
    background: #fff; color: var(--pf-ink); font-size: 13px; font-weight: bold; cursor: pointer;
  }
  .pin-btn:hover { border-color: var(--pf-theme); }

  /* ── Program view ────────────────────────────────────────────────── */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 2px solid var(--pf-border);
  }
  .toolbar .who { font-size: 12px; color: var(--pf-muted); }
  .toolbar button {
    background: none; border: none; color: var(--pf-theme); font-size: 12px;
    font-weight: bold; cursor: pointer;
  }

  .tab-bar { display: flex; border-bottom: 2px solid var(--pf-border); }
  .tab-btn {
    flex: 1; text-align: center; padding: 11px 6px; font-size: 12.5px; font-weight: bold;
    color: var(--pf-muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab-btn.active { color: var(--pf-theme); border-bottom-color: var(--pf-theme); }

  .panel-scroll { padding: 16px 20px 28px; max-height: 640px; overflow-y: auto; }

  .day-group { margin-bottom: 16px; }
  .day-label {
    background: var(--pf-theme); color: #fff; padding: 8px 12px;
    border-radius: 8px 8px 0 0; font-size: 12.5px; font-weight: bold;
  }
  .session-card {
    border: 2px solid var(--pf-border); border-top: none;
    padding: 10px 12px; font-size: 13px;
  }
  .day-group .session-card:last-child { border-radius: 0 0 8px 8px; }
  .session-card .time { font-size: 11px; color: var(--pf-theme); font-weight: bold; }
  .session-card .title { font-weight: bold; margin: 2px 0; }
  .session-card .speaker { font-size: 11.5px; color: var(--pf-muted); }

  .empty-note { text-align:center; color: var(--pf-muted); font-size: 13px; padding: 30px 10px; }

  /* ── Organizer edit mode ─────────────────────────────────────────── */
  .field-group { margin-bottom: 14px; }
  .field-group label { display:block; font-size:11.5px; font-weight:bold; color:var(--pf-muted); margin-bottom:5px; }
  .field-group input, .field-group textarea {
    width: 100%; padding: 9px 11px; border: 2px solid var(--pf-border); border-radius: 8px;
    font-size: 13.5px; font-family: inherit; color: var(--pf-ink);
  }
  .field-group input:focus, .field-group textarea:focus { border-color: var(--pf-theme); outline: none; }
  .field-row { display:flex; gap:10px; }
  .field-row .field-group { flex:1; }

  .session-edit-row {
    border: 2px solid var(--pf-border); border-radius: 10px; padding: 10px; margin-bottom: 10px; position: relative;
  }
  .session-edit-row .remove-btn {
    position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
    border:none; background:var(--pf-red-light); color:var(--pf-red); font-size:12px; font-weight:bold; cursor:pointer;
  }
  .mini-label { font-size:10px; font-weight:bold; color:var(--pf-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; display:block; }

  .add-btn {
    width:100%; padding:10px; border:2px dashed var(--pf-border); border-radius:10px;
    background: var(--pf-gray); color: var(--pf-theme); font-size:12.5px; font-weight:bold; cursor:pointer; margin-bottom: 14px;
  }
  .save-btn {
    width:100%; padding:14px; border:none; border-radius:10px; font-size:14.5px; font-weight:bold;
    background: var(--pf-theme); color:#fff; cursor:pointer;
  }
  .save-btn:hover { filter: brightness(0.92); }
  .save-status { font-size:12px; text-align:center; margin-top:8px; color: var(--pf-muted); }
  .save-status.error { color: var(--pf-red); }
  .save-status.ok { color: var(--pf-green); }

  /* ── Quiz module ─────────────────────────────────────────────────── */
  .quiz-intro { font-size: 12.5px; color: var(--pf-muted); margin-bottom: 16px; line-height: 1.5; }
  .quiz-question-card {
    border: 2px solid var(--pf-border); border-radius: 10px; padding: 12px; margin-bottom: 12px;
  }
  .quiz-question-card.answered { border-color: var(--pf-theme); }
  .quiz-question-card .qnum {
    font-size: 10.5px; font-weight: bold; color: var(--pf-theme); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: 5px;
  }
  .quiz-question-card .qtext { font-weight: bold; font-size: 13.5px; margin-bottom: 8px; }
  .quiz-option-row {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px;
    border: 2px solid var(--pf-border); border-radius: 8px; margin-bottom: 5px; cursor: pointer;
  }
  .quiz-option-row:last-child { margin-bottom: 0; }
  .quiz-option-row.checked { border-color: var(--pf-theme); background: var(--pf-theme-light); }
  .quiz-option-row input { accent-color: var(--pf-theme); width: 15px; height: 15px; flex-shrink: 0; }
  .quiz-option-row span { font-size: 13px; }
  .quiz-submit-btn {
    width: 100%; margin-top: 8px; padding: 13px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: bold; background: var(--pf-border); color: #8a8a8a; cursor: not-allowed;
  }
  .quiz-submit-btn.ready { background: var(--pf-theme); color: #fff; cursor: pointer; }
  .quiz-result-card {
    border-radius: 12px; padding: 20px; text-align: center;
  }
  .quiz-result-card.pass { background: var(--pf-green-light); border: 2px solid var(--pf-green); }
  .quiz-result-card.fail { background: var(--pf-red-light); border: 2px solid var(--pf-red); }
  .quiz-result-card .big-score { font-size: 30px; font-weight: bold; margin: 6px 0; }
  .quiz-result-card.pass .big-score { color: var(--pf-green); }
  .quiz-result-card.fail .big-score { color: var(--pf-red); }
  .quiz-result-card .verdict { font-size: 15px; font-weight: bold; }
  .quiz-result-card.pass .verdict { color: var(--pf-green); }
  .quiz-result-card.fail .verdict { color: var(--pf-red); }

  /* ── Organizer quiz question editor ─────────────────────────────── */
  .quiz-edit-row {
    border: 2px solid var(--pf-border); border-radius: 10px; padding: 12px; margin-bottom: 10px; position: relative;
  }
  .quiz-edit-row .remove-btn {
    position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%;
    border:none; background:var(--pf-red-light); color:var(--pf-red); font-size:12px; font-weight:bold; cursor:pointer;
  }
  .quiz-opt-edit-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .quiz-opt-edit-row input[type="radio"] { accent-color: var(--pf-theme); flex-shrink: 0; }
  .quiz-opt-edit-row input[type="text"] { flex: 1; padding: 7px 9px; font-size: 12.5px; }
</style>
</head>
<body>

<div class="shell" id="shell">
  <div class="state-screen">Loading conference…</div>
</div>

<script>
// Point this at your platform worker once it's deployed (see
// platform-setup-guide.md). Left empty for now — the app falls back to a
// small built-in demo conference so the UI can be built and tested before
// the backend exists.
const PLATFORM_WORKER_URL = "https://cm-worker.confrenceplaner.workers.dev/";

const DEMO_CONFERENCE = {
  meta: {
    name: "Demo Conference 2027",
    slug: "demo",
    themeColor: "#3E4C9C",
    startDate: "2027-06-10",
    endDate: "2027-06-11",
    contactEmail: "demo@example.com",
    participantCount: 50,
  },
  schedule: [
    { date: "2027-06-10", time: "09:00", title: "Welcome & opening remarks", speaker: "Dr. A. Organizer" },
    { date: "2027-06-10", time: "10:00", title: "Keynote: The future of the field", speaker: "Prof. B. Speaker" },
    { date: "2027-06-11", time: "09:30", title: "Workshop session", speaker: "Dr. C. Facilitator" },
  ],
};

const params = new URLSearchParams(location.search);
const confSlug = params.get("conf");
const wantsAdmin = params.get("admin") === "1";

let confData = null;   // { meta, schedule }
let mode = "loading";  // loading | error | login | participant | organizer-login | organizer
let loginNr = "";
let loginError = "";
let pinInput = "";
let pinError = "";
let editMeta = null;
let editSessions = null;
let saveStatus = "";
let saveStatusIsError = false;

// ── Quiz module state (participant side) ─────────────────────────────
let participantTab = "schedule"; // "schedule" | "quiz"
let quizQuestions = null;   // fetched lazily, null = not fetched yet
let quizLoading = false;
let quizAnswers = {};
let quizStatus = null;      // { locked, submittedAt, passed, scorePct } from server
let quizSubmitting = false;
let quizResult = null;      // result returned right after a successful submit

// ── Quiz module state (organizer side) ────────────────────────────────
let editQuizQuestions = null;
let editQuizPassPct = 70;
let resetLookupNr = "";
let resetLookupResult = null; // { locked, submittedAt, passed, scorePct } | { error }
let quizSaveStatus = "";
let quizSaveStatusIsError = false;

function applyTheme(hex) {
  const light = hexToLight(hex);
  document.documentElement.style.setProperty("--pf-theme", hex);
  document.documentElement.style.setProperty("--pf-theme-light", light);
}
function hexToLight(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const mix = (c) => Math.round(c + (255 - c) * 0.9);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

async function loadConference() {
  if (!confSlug) {
    mode = "error-noslug";
    render();
    return;
  }

  if (!PLATFORM_WORKER_URL) {
    confData = DEMO_CONFERENCE;
    applyTheme(confData.meta.themeColor);
    mode = wantsAdmin ? "organizer-login" : "login";
    render();
    return;
  }

  try {
    const res = await fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}`);
    if (!res.ok) {
      mode = "error-notfound";
      render();
      return;
    }
    confData = await res.json();
    applyTheme(confData.meta.themeColor);
    mode = wantsAdmin ? "organizer-login" : "login";
    render();
  } catch (err) {
    mode = "error-network";
    render();
  }
}

function render() {
  const shell = document.getElementById("shell");

  if (mode === "loading") {
    shell.innerHTML = `<div class="state-screen">Loading conference…</div>`;
    return;
  }
  if (mode === "error-noslug") {
    shell.innerHTML = `<div class="state-screen"><h2>No conference specified</h2>
      This link doesn't say which conference to show.
      <div style="margin-top:16px;"><a class="login-btn" style="display:inline-block;text-decoration:none;padding:12px 22px;" href="overview.html">Browse all conferences</a></div>
    </div>`;
    return;
  }
  if (mode === "error-notfound") {
    shell.innerHTML = `<div class="state-screen"><h2>Conference not found</h2>Check the link and try again, or contact the organizer.
      <div style="margin-top:16px;"><a class="login-btn" style="display:inline-block;text-decoration:none;padding:12px 22px;" href="overview.html">Browse all conferences</a></div>
    </div>`;
    return;
  }
  if (mode === "error-network") {
    shell.innerHTML = `<div class="state-screen"><h2>Couldn't connect</h2>Check your internet connection and reload the page.</div>`;
    return;
  }

  const meta = confData.meta;

  if (mode === "login") {
    shell.innerHTML = `
      <div class="conf-header">
        <div class="eyebrow"><span>Participant login</span></div>
        <h1>${escHtml(meta.name)}</h1>
        <div class="dates">${formatDateRange(meta.startDate, meta.endDate)}</div>
      </div>
      <div class="login-body">
        <div class="login-label">Your participant number</div>
        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="loginNrInput"
          placeholder="e.g. 1–${meta.participantCount}" value="${escHtml(loginNr)}"
          oninput="onLoginNr(this.value)" onkeydown="if(event.key==='Enter')doParticipantLogin()">
        <div class="login-hint">Enter any number from 1 to ${meta.participantCount}.</div>
        <div class="login-error">${escHtml(loginError)}</div>
        <button class="login-btn" onclick="doParticipantLogin()">View programme</button>

        <div class="login-divider">or</div>
        <button class="pin-btn" onclick="goToOrganizerLogin()">I'm the organizer</button>
      </div>
    `;
    return;
  }

  if (mode === "organizer-login") {
    shell.innerHTML = `
      <div class="conf-header">
        <div class="eyebrow"><span>Organizer access</span></div>
        <h1>${escHtml(meta.name)}</h1>
        <div class="dates">${formatDateRange(meta.startDate, meta.endDate)}</div>
      </div>
      <div class="login-body">
        <div class="login-label">Admin PIN</div>
        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="pinInputField"
          placeholder="••••" maxlength="6" value="${escHtml(pinInput)}"
          oninput="onPinInput(this.value)" onkeydown="if(event.key==='Enter')doOrganizerLogin()">
        <div class="login-error">${escHtml(pinError)}</div>
        <button class="login-btn" onclick="doOrganizerLogin()">Unlock editing</button>
        <div class="login-divider">or</div>
        <button class="pin-btn" onclick="goToParticipantLogin()">View as a participant</button>
      </div>
    `;
    return;
  }

  if (mode === "participant") {
    const hasQuiz = meta.modules && meta.modules.quiz;
    shell.innerHTML = `
      <div class="conf-header">
        <div class="eyebrow"><span>Programme</span><span class="mode-badge">Participant</span></div>
        <h1>${escHtml(meta.name)}</h1>
        <div class="dates">${formatDateRange(meta.startDate, meta.endDate)}</div>
      </div>
      <div class="toolbar">
        <div class="who">Logged in as #${escHtml(loginNr)}</div>
        <button onclick="goToParticipantLogin()">Switch number</button>
      </div>
      ${hasQuiz ? `
        <div class="tab-bar">
          <div class="tab-btn ${participantTab === 'schedule' ? 'active' : ''}" onclick="switchParticipantTab('schedule')">Programme</div>
          <div class="tab-btn ${participantTab === 'quiz' ? 'active' : ''}" onclick="switchParticipantTab('quiz')">Test</div>
        </div>
      ` : ""}
      <div class="panel-scroll" id="participantScroll">
        ${participantTab === "quiz" && hasQuiz ? renderQuizTab() : renderScheduleReadOnly(confData.schedule)}
      </div>
    `;
    return;
  }

  if (mode === "organizer") {
    shell.innerHTML = `
      <div class="conf-header">
        <div class="eyebrow"><span>Editing</span><span class="mode-badge">Organizer</span></div>
        <h1>${escHtml(meta.name)}</h1>
        <div class="dates">${formatDateRange(meta.startDate, meta.endDate)}</div>
      </div>
      <div class="toolbar">
        <div class="who">Unlocked with admin PIN</div>
        <button onclick="mode='login';loginNr='';render();">View as participant</button>
      </div>
      <div class="panel-scroll" id="organizerScroll">${renderOrganizerEditor()}</div>
    `;
    return;
  }
}

// ── Participant login ─────────────────────────────────────────────
function onLoginNr(v) { loginNr = v.replace(/\D/g, ""); }

function doParticipantLogin() {
  const val = parseInt(loginNr);
  const max = confData.meta.participantCount;
  if (!val || val < 1 || val > max) {
    loginError = `Please enter a number between 1 and ${max}.`;
    render();
    return;
  }
  loginError = "";
  resetQuizParticipantState();
  mode = "participant";
  render();
}

function goToParticipantLogin() {
  loginNr = ""; loginError = "";
  resetQuizParticipantState();
  mode = "login";
  render();
}

function resetQuizParticipantState() {
  participantTab = "schedule";
  quizQuestions = null;
  quizLoading = false;
  quizAnswers = {};
  quizStatus = null;
  quizSubmitting = false;
  quizResult = null;
}

// ── Organizer login ────────────────────────────────────────────────
function goToOrganizerLogin() {
  pinInput = ""; pinError = "";
  mode = "organizer-login";
  render();
}

function onPinInput(v) { pinInput = v.replace(/\D/g, "").slice(0, 6); }

function doOrganizerLogin() {
  if (!PLATFORM_WORKER_URL) {
    // Demo mode: any 4+ digit PIN "works" so the editor UI can be tried.
    if (pinInput.length < 4) { pinError = "Enter at least 4 digits."; render(); return; }
    enterOrganizerMode();
    return;
  }

  // We don't have a dedicated "verify pin" endpoint — the update endpoint
  // itself checks the PIN, so we do a harmless no-op update (sending no
  // fields) purely to validate the PIN before entering edit mode.
  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ adminPin: pinInput }),
  })
    .then(async (res) => {
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        pinError = data.error || "Incorrect PIN.";
        render();
        return;
      }
      enterOrganizerMode();
    })
    .catch(() => { pinError = "Couldn't verify PIN — check your connection."; render(); });
}

function enterOrganizerMode() {
  editMeta = Object.assign({}, confData.meta);
  if (!editMeta.modules) editMeta.modules = { quiz: false, stations: false };
  editSessions = confData.schedule.map(s => Object.assign({}, s));
  if (editSessions.length === 0) editSessions.push({ date: "", time: "", title: "", speaker: "" });
  saveStatus = ""; saveStatusIsError = false;

  editQuizQuestions = null;
  editQuizPassPct = 70;
  resetLookupNr = ""; resetLookupResult = null;

  mode = "organizer";
  render();
  loadQuizForEdit();
}

function loadQuizForEdit() {
  if (!PLATFORM_WORKER_URL) {
    editQuizQuestions = confData.quizQuestions ? confData.quizQuestions.map(q => Object.assign({}, q)) : [];
    if (editQuizQuestions.length === 0) editQuizQuestions.push(blankQuizQuestion());
    rerenderOrganizerScroll();
    return;
  }
  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/edit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ adminPin: pinInput }),
  })
    .then(res => res.json())
    .then(data => {
      editQuizQuestions = (data.questions || []).map(q => Object.assign({}, q));
      if (editQuizQuestions.length === 0) editQuizQuestions.push(blankQuizQuestion());
      if (data.config && data.config.passThreshold) editQuizPassPct = Math.round(data.config.passThreshold * 100);
      rerenderOrganizerScroll();
    })
    .catch(() => {
      editQuizQuestions = [blankQuizQuestion()];
      rerenderOrganizerScroll();
    });
}

function blankQuizQuestion() {
  return { text: "", options: ["", "", "", ""], correctIndex: 0 };
}

// ── Read-only schedule (participant view) ────────────────────────────
function renderScheduleReadOnly(schedule) {
  if (!schedule || schedule.length === 0) {
    return `<div class="empty-note">The programme hasn't been published yet — check back soon.</div>`;
  }
  const byDay = groupByDate(schedule);
  return Object.keys(byDay).sort().map(date => `
    <div class="day-group">
      <div class="day-label">${formatDateLabel(date)}</div>
      ${byDay[date].map(s => `
        <div class="session-card">
          <div class="time">${escHtml(s.time || "")}</div>
          <div class="title">${escHtml(s.title)}</div>
          ${s.speaker ? `<div class="speaker">${escHtml(s.speaker)}</div>` : ""}
        </div>
      `).join("")}
    </div>
  `).join("");
}

function groupByDate(schedule) {
  const groups = {};
  schedule.forEach(s => {
    const key = s.date || "unscheduled";
    if (!groups[key]) groups[key] = [];
    groups[key].push(s);
  });
  Object.values(groups).forEach(list => list.sort((a,b) => (a.time||"").localeCompare(b.time||"")));
  return groups;
}

function formatDateLabel(dateStr) {
  if (dateStr === "unscheduled") return "Unscheduled";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}

function formatDateRange(start, end) {
  if (!start || !end) return "";
  const s = new Date(start + "T00:00:00"), e = new Date(end + "T00:00:00");
  const opts = { day: "numeric", month: "long", year: "numeric" };
  if (start === end) return s.toLocaleDateString("en-GB", opts);
  return `${s.toLocaleDateString("en-GB", { day: "numeric", month: "long" })} – ${e.toLocaleDateString("en-GB", opts)}`;
}

// ── Quiz module (participant side) ────────────────────────────────────
function switchParticipantTab(tab) {
  participantTab = tab;
  render();
  if (tab === "quiz" && quizQuestions === null && !quizLoading) {
    loadQuiz();
  }
}

function loadQuiz() {
  quizLoading = true;
  rerenderParticipantScroll();

  if (!PLATFORM_WORKER_URL) {
    // Demo mode: a couple of made-up questions so the flow can be tried.
    setTimeout(() => {
      quizQuestions = [
        { id: "Q1", text: "Demo question 1 — pick option B.", options: ["Option A", "Option B", "Option C", "Option D"] },
        { id: "Q2", text: "Demo question 2 — pick option A.", options: ["Option A", "Option B", "Option C", "Option D"] },
      ];
      quizStatus = { locked: false };
      quizLoading = false;
      rerenderParticipantScroll();
    }, 200);
    return;
  }

  Promise.all([
    fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz`).then(r => r.json()),
    fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/status?nr=${encodeURIComponent(loginNr)}`).then(r => r.json()),
  ])
    .then(([quizData, statusData]) => {
      quizQuestions = quizData.questions || [];
      quizStatus = statusData;
      quizLoading = false;
      rerenderParticipantScroll();
    })
    .catch(() => {
      quizQuestions = [];
      quizStatus = null;
      quizLoading = false;
      rerenderParticipantScroll();
    });
}

function rerenderParticipantScroll() {
  const el = document.getElementById("participantScroll");
  if (el) el.innerHTML = renderQuizTab();
}

function renderQuizTab() {
  if (quizLoading) {
    return `<div class="empty-note">Loading…</div>`;
  }
  if (quizResult) {
    const passed = quizResult.passed;
    return `
      <div class="quiz-result-card ${passed ? 'pass' : 'fail'}">
        <div class="verdict">${passed ? "Passed" : "Not passed"}</div>
        <div class="big-score">${quizResult.correctCount} / ${quizResult.total}</div>
        <div style="font-size:12.5px;color:var(--pf-muted);">${quizResult.scorePct}% correct — your answers are locked and can't be changed.</div>
      </div>
    `;
  }
  if (quizStatus && quizStatus.locked) {
    const passed = quizStatus.passed;
    return `
      <div class="quiz-result-card ${passed ? 'pass' : 'fail'}">
        <div class="verdict">${passed ? "Passed" : "Not passed"}</div>
        ${typeof quizStatus.scorePct === "number" ? `<div class="big-score">${quizStatus.scorePct}%</div>` : ""}
        <div style="font-size:12.5px;color:var(--pf-muted);">You already submitted this test${quizStatus.submittedAt ? " on " + new Date(quizStatus.submittedAt).toLocaleString("en-GB") : ""}. It can only be taken once.</div>
      </div>
    `;
  }
  if (!quizQuestions || quizQuestions.length === 0) {
    return `<div class="empty-note">The test hasn't been set up yet — check back soon.</div>`;
  }

  const answeredCount = Object.keys(quizAnswers).length;
  const allAnswered = answeredCount === quizQuestions.length;

  const questionsHtml = quizQuestions.map(q => {
    const isAnswered = quizAnswers[q.id] !== undefined;
    return `
      <div class="quiz-question-card ${isAnswered ? 'answered' : ''}">
        <div class="qnum">${escHtml(q.id)}</div>
        <div class="qtext">${escHtml(q.text)}</div>
        ${q.options.map((opt, i) => `
          <label class="quiz-option-row ${quizAnswers[q.id] === i ? 'checked' : ''}">
            <input type="radio" name="${q.id}" ${quizAnswers[q.id] === i ? "checked" : ""} onchange="onQuizAnswer('${q.id}',${i})">
            <span>${escHtml(opt)}</span>
          </label>
        `).join("")}
      </div>
    `;
  }).join("");

  return `
    <div class="quiz-intro">Answer all questions, then submit. Your answers are locked once you submit — the test can only be taken once.</div>
    ${questionsHtml}
    <button class="quiz-submit-btn ${allAnswered ? 'ready' : ''}" id="quizSubmitBtn" ${allAnswered ? "" : "disabled"} onclick="submitQuiz()">
      ${quizSubmitting ? "Submitting..." : "Submit answers"}
    </button>
  `;
}

function onQuizAnswer(qid, optionIndex) {
  quizAnswers[qid] = optionIndex;
  rerenderParticipantScroll();
}

function submitQuiz() {
  const allAnswered = Object.keys(quizAnswers).length === quizQuestions.length;
  if (!allAnswered) return;
  if (!confirm("Are you sure? You won't be able to change your answers once you submit.")) return;

  quizSubmitting = true;
  rerenderParticipantScroll();

  if (!PLATFORM_WORKER_URL) {
    console.log("Simulated quiz submit (PLATFORM_WORKER_URL is not set yet):", quizAnswers);
    setTimeout(() => {
      quizSubmitting = false;
      quizResult = { correctCount: 1, total: quizQuestions.length, scorePct: 50, passed: true };
      rerenderParticipantScroll();
    }, 300);
    return;
  }

  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/submit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nr: loginNr, answers: quizAnswers }),
  })
    .then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ("Server error (" + res.status + ")"));
      quizSubmitting = false;
      quizResult = data;
      rerenderParticipantScroll();
    })
    .catch((err) => {
      quizSubmitting = false;
      rerenderParticipantScroll();
      alert("Couldn't submit: " + err.message);
    });
}

// ── Organizer editor ───────────────────────────────────────────────
function renderOrganizerEditor() {
  const hasQuiz = editMeta.modules && editMeta.modules.quiz;
  return `
    <div class="field-group">
      <label>Conference name</label>
      <input type="text" value="${escHtml(editMeta.name)}" oninput="onEditMeta('name', this.value)">
    </div>
    <div class="field-row">
      <div class="field-group">
        <label>Start date</label>
        <input type="date" value="${escHtml(editMeta.startDate)}" oninput="onEditMeta('startDate', this.value)">
      </div>
      <div class="field-group">
        <label>End date</label>
        <input type="date" value="${escHtml(editMeta.endDate)}" oninput="onEditMeta('endDate', this.value)">
      </div>
    </div>
    <div class="field-group">
      <label>Contact email</label>
      <input type="email" value="${escHtml(editMeta.contactEmail || "")}" oninput="onEditMeta('contactEmail', this.value)">
    </div>
    <div class="field-group">
      <label>Number of participant numbers open</label>
      <input type="number" min="1" max="9999" value="${editMeta.participantCount}" oninput="onEditMeta('participantCount', parseInt(this.value)||0)">
    </div>

    <div class="mini-label" style="margin:16px 0 8px;font-size:12px;">Schedule</div>
    ${editSessions.map((s, i) => `
      <div class="session-edit-row">
        ${editSessions.length > 1 ? `<button class="remove-btn" onclick="removeEditSession(${i})">✕</button>` : ""}
        <div class="field-row" style="margin-bottom:8px;">
          <div>
            <span class="mini-label">Date</span>
            <input type="date" value="${escHtml(s.date)}" oninput="onEditSession(${i},'date',this.value)">
          </div>
          <div>
            <span class="mini-label">Time</span>
            <input type="time" value="${escHtml(s.time)}" oninput="onEditSession(${i},'time',this.value)">
          </div>
        </div>
        <div style="margin-bottom:8px;">
          <span class="mini-label">Title</span>
          <input type="text" value="${escHtml(s.title)}" oninput="onEditSession(${i},'title',this.value)">
        </div>
        <div>
          <span class="mini-label">Speaker / location</span>
          <input type="text" value="${escHtml(s.speaker)}" oninput="onEditSession(${i},'speaker',this.value)">
        </div>
      </div>
    `).join("")}
    <button class="add-btn" onclick="addEditSession()">+ Add session</button>

    <button class="save-btn" onclick="saveOrganizerChanges()">Save changes</button>
    <div class="save-status ${saveStatusIsError ? 'error' : 'ok'}">${escHtml(saveStatus)}</div>

    <div class="mini-label" style="margin:24px 0 8px;font-size:12px;">Modules</div>
    <label class="module-toggle" style="border:2px solid var(--pf-border);border-radius:10px;padding:12px;display:flex;">
      <input type="checkbox" ${hasQuiz ? "checked" : ""} onchange="onToggleQuizModule(this.checked)" style="width:18px;height:18px;margin-top:2px;accent-color:var(--pf-theme);flex-shrink:0;">
      <div>
        <div style="font-size:13.5px;font-weight:bold;">Test / Quiz</div>
        <div style="font-size:11.5px;color:var(--pf-muted);">Enable the Test tab for participants.</div>
      </div>
    </label>

    ${hasQuiz ? renderQuizEditor() : ""}
    ${hasQuiz ? renderQuizResetTool() : ""}
  `;
}

function renderQuizEditor() {
  if (editQuizQuestions === null) {
    return `<div class="mini-label" style="margin:20px 0 8px;font-size:12px;">Quiz questions</div><div class="empty-note">Loading…</div>`;
  }
  return `
    <div class="mini-label" style="margin:20px 0 8px;font-size:12px;">Quiz questions</div>

    <div class="field-group">
      <label>Pass mark (%)</label>
      <input type="number" min="1" max="100" value="${editQuizPassPct}" oninput="onEditQuizPassPct(this.value)" style="max-width:120px;">
    </div>

    ${editQuizQuestions.map((q, i) => `
      <div class="quiz-edit-row">
        ${editQuizQuestions.length > 1 ? `<button class="remove-btn" onclick="removeQuizQuestion(${i})">✕</button>` : ""}
        <div style="margin-bottom:8px;">
          <span class="mini-label">Question ${i + 1}</span>
          <input type="text" value="${escHtml(q.text)}" placeholder="e.g. What is the recommended dose?" oninput="onEditQuizQuestion(${i},'text',this.value)">
        </div>
        <span class="mini-label">Options (select the correct one)</span>
        ${[0,1,2,3].map(oi => `
          <div class="quiz-opt-edit-row">
            <input type="radio" name="correct-${i}" ${q.correctIndex === oi ? "checked" : ""} onchange="onEditQuizCorrect(${i},${oi})">
            <input type="text" value="${escHtml(q.options[oi] || "")}" placeholder="Option ${oi+1}" oninput="onEditQuizOption(${i},${oi},this.value)">
          </div>
        `).join("")}
      </div>
    `).join("")}
    <button class="add-btn" onclick="addQuizQuestion()">+ Add question</button>
    <button class="save-btn" onclick="saveQuizQuestions()">Save quiz questions</button>
    <div class="save-status ${quizSaveStatusIsError ? 'error' : 'ok'}">${escHtml(quizSaveStatus)}</div>
  `;
}

function renderQuizResetTool() {
  return `
    <div class="mini-label" style="margin:24px 0 8px;font-size:12px;">Reset a participant's quiz</div>
    <div class="field-row" style="align-items:flex-end;">
      <div class="field-group" style="margin-bottom:0;">
        <label>Participant number</label>
        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${escHtml(resetLookupNr)}" oninput="onResetLookupNr(this.value)">
      </div>
      <button class="save-btn" style="width:auto;padding:9px 16px;margin-top:0;" onclick="lookupQuizStatus()">Look up</button>
    </div>
    ${renderResetLookupResult()}
  `;
}

function renderResetLookupResult() {
  if (!resetLookupResult) return "";
  if (resetLookupResult.error) {
    return `<div class="save-status error">${escHtml(resetLookupResult.error)}</div>`;
  }
  if (!resetLookupResult.locked) {
    return `<div class="save-status ok">Participant ${escHtml(resetLookupNr)} hasn't submitted the quiz yet — nothing to reset.</div>`;
  }
  return `
    <div class="save-status ok">Participant ${escHtml(resetLookupNr)}: submitted${resetLookupResult.submittedAt ? " on " + new Date(resetLookupResult.submittedAt).toLocaleString("en-GB") : ""} — ${resetLookupResult.passed ? "Passed" : "Not passed"}.</div>
    <button class="save-btn" style="background:var(--pf-red);margin-top:8px;" onclick="doQuizReset()">Reset, so they can take it again</button>
  `;
}

function onToggleQuizModule(checked) {
  editMeta.modules.quiz = checked;
  if (checked && editQuizQuestions === null) loadQuizForEdit();
  rerenderOrganizerScroll();
}

function onEditQuizPassPct(val) {
  editQuizPassPct = parseInt(val) || 0;
}

function onEditQuizQuestion(i, key, val) { editQuizQuestions[i][key] = val; }
function onEditQuizOption(i, oi, val) { editQuizQuestions[i].options[oi] = val; }
function onEditQuizCorrect(i, oi) {
  editQuizQuestions[i].correctIndex = oi;
  rerenderOrganizerScroll();
}
function addQuizQuestion() {
  editQuizQuestions.push(blankQuizQuestion());
  rerenderOrganizerScroll();
}
function removeQuizQuestion(i) {
  editQuizQuestions.splice(i, 1);
  rerenderOrganizerScroll();
}

function saveQuizQuestions() {
  quizSaveStatus = "Saving…"; quizSaveStatusIsError = false;
  rerenderOrganizerScroll();

  const cleanQuestions = editQuizQuestions.filter(q => q.text && q.text.trim() && q.options.every(o => o && o.trim()));
  if (cleanQuestions.length === 0) {
    quizSaveStatus = "Add at least one question with all 4 options filled in.";
    quizSaveStatusIsError = true;
    rerenderOrganizerScroll();
    return;
  }

  const payload = {
    adminPin: pinInput,
    quizQuestions: cleanQuestions,
    quizConfig: { passThreshold: Math.min(1, Math.max(0.01, editQuizPassPct / 100)) },
  };

  if (!PLATFORM_WORKER_URL) {
    console.log("Simulated quiz question save (PLATFORM_WORKER_URL is not set yet):", payload);
    quizSaveStatus = "Saved (simulated — no backend connected yet).";
    quizSaveStatusIsError = false;
    rerenderOrganizerScroll();
    return;
  }

  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
    .then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ("Server error (" + res.status + ")"));
      quizSaveStatus = "Saved — participants will see the updated quiz.";
      quizSaveStatusIsError = false;
      rerenderOrganizerScroll();
    })
    .catch((err) => {
      quizSaveStatus = "Couldn't save: " + err.message;
      quizSaveStatusIsError = true;
      rerenderOrganizerScroll();
    });
}

function onResetLookupNr(val) { resetLookupNr = val.replace(/\D/g, ""); }

function lookupQuizStatus() {
  if (!resetLookupNr) return;
  resetLookupResult = null;
  rerenderOrganizerScroll();

  if (!PLATFORM_WORKER_URL) {
    resetLookupResult = { locked: false };
    rerenderOrganizerScroll();
    return;
  }

  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/status?nr=${encodeURIComponent(resetLookupNr)}`)
    .then(res => res.json())
    .then(data => { resetLookupResult = data; rerenderOrganizerScroll(); })
    .catch(() => { resetLookupResult = { error: "Couldn't check status." }; rerenderOrganizerScroll(); });
}

function doQuizReset() {
  if (!confirm(`Reset the quiz for participant ${resetLookupNr}? They'll be able to take it again.`)) return;

  if (!PLATFORM_WORKER_URL) {
    console.log("Simulated quiz reset (PLATFORM_WORKER_URL is not set yet) for nr", resetLookupNr);
    resetLookupResult = { locked: false };
    rerenderOrganizerScroll();
    return;
  }

  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/reset`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nr: resetLookupNr, adminPin: pinInput }),
  })
    .then(res => res.json())
    .then(() => { resetLookupResult = { locked: false }; rerenderOrganizerScroll(); })
    .catch(() => alert("Couldn't reset — check your connection."));
}


function onEditMeta(key, val) { editMeta[key] = val; }
function onEditSession(i, key, val) { editSessions[i][key] = val; }
function addEditSession() {
  editSessions.push({ date: "", time: "", title: "", speaker: "" });
  rerenderOrganizerScroll();
}
function removeEditSession(i) {
  editSessions.splice(i, 1);
  rerenderOrganizerScroll();
}
function rerenderOrganizerScroll() {
  document.getElementById("organizerScroll").innerHTML = renderOrganizerEditor();
}

function saveOrganizerChanges() {
  saveStatus = "Saving…"; saveStatusIsError = false;
  rerenderOrganizerScroll();

  const payload = {
    adminPin: pinInput,
    name: editMeta.name,
    startDate: editMeta.startDate,
    endDate: editMeta.endDate,
    contactEmail: editMeta.contactEmail,
    participantCount: editMeta.participantCount,
    modules: editMeta.modules,
    sessions: editSessions.filter(s => s.title && s.title.trim()),
  };

  if (!PLATFORM_WORKER_URL) {
    console.log("Simulated save (PLATFORM_WORKER_URL is not set yet):", payload);
    confData.meta = Object.assign({}, confData.meta, payload);
    confData.schedule = payload.sessions;
    saveStatus = "Saved (simulated — no backend connected yet)."; saveStatusIsError = false;
    rerenderOrganizerScroll();
    return;
  }

  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
    .then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ("Server error (" + res.status + ")"));
      confData.meta = Object.assign({}, confData.meta, payload);
      confData.schedule = payload.sessions;
      saveStatus = "Saved — participants will see the update next time they load the page.";
      saveStatusIsError = false;
      rerenderOrganizerScroll();
    })
    .catch((err) => {
      saveStatus = "Couldn't save: " + err.message;
      saveStatusIsError = true;
      rerenderOrganizerScroll();
    });
}

function escHtml(str) {
  return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

loadConference();
</script>
